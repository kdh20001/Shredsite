<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- DA AUDIO SCRIPT OF SOUNDNESS GO CRAZY Shit is using javascript. We got C# and javascript and html/CSS blazor is N U T S -->
    <script>
        window.playAudio = (elementId) => {
            var audio = document.getElementById(elementId);
            if (audio) {
                audio.currentTime = 0;
                // Play returns a promise, catch any browser autoplay blocks safely
                audio.play().catch(error => {
                    console.log("Autoplay prevented or audio failed:", error);
                });
            } else {
                console.log("Audio element not found yet: " + elementId);
            }
        };
    </script>


</body>
